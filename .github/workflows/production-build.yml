name: Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # Required to create releases and push commits

jobs:
  build-production:
    name: Build Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --legacy-peer-deps && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Auto-increment version
        run: |
          # Get current version from package.json
          current_version=$(node -p "require('./package.json').version")

          # Auto-increment patch version (0.0.1)
          IFS='.' read -ra VERSION_PARTS <<< "$current_version"
          new_patch=$((VERSION_PARTS[2] + 1))
          new_version="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${new_patch}"

          echo "Current version: $current_version"
          echo "New version: $new_version"

          # Update package.json
          npm version --no-git-tag-version "$new_version"

          # Export for use in next steps
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

      - name: Build production APK
        run: eas build --platform android --profile production --non-interactive
        env:
          EAS_SKIP_AUTO_FINGERPRINT: 1

      - name: Create release notes
        run: |
          echo "# SleepFactor v${{ env.NEW_VERSION }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## What's New" >> release_notes.md
          echo "- Bug fixes and improvements" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Build Information" >> release_notes.md
          echo "- Built on: $(date)" >> release_notes.md
          echo "- Commit: ${{ github.sha }}" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: SleepFactor v${{ env.NEW_VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "Release v${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed - this is normal for the first automated release"
