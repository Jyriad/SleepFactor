name: iOS TestFlight Release

on:
  workflow_dispatch:

jobs:
  build-and-submit-ios:
    name: Build and Submit iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        run: |
          echo "${{ secrets.ASC_API_KEY }}" > asc-api-key.p8
          chmod 600 asc-api-key.p8

      - name: Build iOS for TestFlight
        id: build_submit
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      # EAS Submit reads ascAppId from eas.json (not from a CLI flag on this CLI version).
      - name: Configure submit profile with App Store Connect app ID
        run: |
          node <<'NODE'
          const fs = require('fs');
          const id = (process.env.ASC_APP_ID || '').trim();
          if (!id || !/^\d+$/.test(id)) {
            console.error('Set repository secret ASC_APP_ID to your numeric App Store Connect Apple ID (App Information → Apple ID).');
            process.exit(1);
          }
          const p = 'eas.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.submit = j.submit || {};
          j.submit.production = j.submit.production || {};
          j.submit.production.ios = {
            ...(j.submit.production.ios || {}),
            ascAppId: id,
          };
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          console.log('submit.production.ios.ascAppId configured for non-interactive submit.');
          NODE
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}

      - name: Submit latest iOS build to TestFlight
        id: submit_testflight
        run: eas submit --platform ios --latest --profile production --non-interactive
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      - name: Cleanup App Store Connect API key
        if: always()
        run: rm -f asc-api-key.p8

      - name: Publish workflow summary
        if: always()
        run: |
          echo "## iOS TestFlight Release Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build step outcome: ${{ steps.build_submit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submit step outcome: ${{ steps.submit_testflight.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Overall job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ iOS production build and TestFlight submit completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ iOS release failed. Open failed step logs above for the root cause." >> "$GITHUB_STEP_SUMMARY"
          fi
